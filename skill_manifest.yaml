skill_name: academic-paper-writing-skill
legacy_skill_name: academic_research_and_graduation_thesis_skill
version: 2.1.0
workspace_schema_version: 2
provider_contract_version: 1
audience:
  - Codex
  - Claude Code
  - ChatGPT
  - future_agentic_models
entrypoint: SKILL.md
capability_registry: capability_registry.yaml

canonical_formats:
  - markdown
  - yaml
  - csv
  - source_code
  - source_native_data
export_formats_optional:
  - xlsx
  - docx
  - pdf
  - pptx
  - latex
  - html

core_invariants:
  - no_fabricated_papers
  - no_fabricated_sota
  - no_fabricated_results
  - no_invented_local_requirements
  - primary_source_first
  - claim_to_evidence_mapping
  - research_ideas_are_proposals
  - statistical_honesty
  - data_provenance
  - integrity_before_persuasion
  - modular_loading
  - external_skill_low_coupling
  - human_review_for_high_stakes_decisions
  - backward_compatibility

shared_invariants:
  - modules/00_core_invariants.md

provider_interface:
  router: modules/22_capability_provider_router.md
  registry: capability_registry.yaml
  handoff_template: templates/capability_handoff.yaml
  resolver: scripts/resolve_capability.py
  validator: scripts/validate_capability_registry.py
  policy:
    - explicit_user_provider_choice_is_preserved
    - selected_provider_skill_is_read_completely
    - unknown_providers_are_not_silently_installed
    - provider_outputs_are_isolated_and_validated
    - internal_fallback_remains_available
    - core_invariants_override_provider_conflicts

capability_routes:
  research_orchestration:
    modules: [modules/01_agent_orchestrator.md, modules/02_mode_router.md]
  research_ideation:
    modules: [modules/18_research_ideation_and_question_design.md]
    outputs: [templates/research_idea_portfolio.csv, templates/assumption_register.md]
  scholarly_search:
    modules: [modules/20_scholarly_search_screening_and_references.md]
    outputs: [templates/search_protocol.md, templates/screening_log.csv]
  literature_review:
    modules: [modules/06_literature_engine.md]
    outputs: [templates/paper_reading_note.md, templates/literature_matrix.csv]
  novelty_and_scope:
    modules: [modules/07_novelty_verification_and_scoring.md, modules/08_research_roi_scope.md]
    outputs: [templates/novelty_verification.csv, templates/roi_matrix.csv, templates/scope_ladder.md]
  study_design_statistics_and_data:
    modules: [modules/19_study_design_statistics_and_data.md, modules/09_experiment_matrix_engine.md]
    outputs: [templates/statistical_analysis_plan.md, templates/data_provenance.csv, templates/experiment_matrix.csv]
  figures_and_tables:
    modules: [modules/10_figure_table_engine.md]
    outputs: [templates/figure_brief.md]
  writing_and_polishing:
    modules: [modules/12_writing_style_adapter.md]
    outputs: [templates/terminology_ledger.csv, templates/claim_ledger.csv]
  integrity_and_reproducibility:
    modules: [modules/11_integrity_reproducibility_guard.md]
    outputs: [templates/integrity_checklist.md, templates/claim_ledger.csv, templates/data_provenance.csv]
  peer_review_and_response:
    modules: [modules/13_simulated_review_rebuttal.md]
    outputs: [templates/simulated_review.md, templates/rebuttal_matrix.md]
  research_delivery_and_presentation:
    modules: [modules/21_research_delivery_and_presentation.md]
    outputs: [templates/submission_package_checklist.md, templates/presentation_brief.md]
  undergraduate_thesis:
    modules: [modules/04_requirement_discovery.md, modules/14_undergraduate_thesis_engine.md]
    outputs: [templates/requirement_discovery_log.md, templates/scope_ladder.md, templates/graduation_evidence_map.csv]
  external_skill_gateway:
    modules: [modules/03_external_skill_gateway.md, modules/17_external_skill_acceptance_tests.md, modules/22_capability_provider_router.md]
    outputs: [templates/external_skill_candidates.csv, templates/external_skill_contract.md, templates/capability_handoff.yaml]

project_types:
  research_paper:
    purpose: Publishable paper, review, preprint, workshop, conference, or journal submission.
    stages:
      - idea_discovery
      - question_design
      - search_protocol
      - literature_review
      - novelty_verification
      - roi_scope_decision
      - study_design
      - experiment_design
      - data_analysis
      - figure_table_production
      - drafting
      - integrity_audit
      - simulated_review
      - rebuttal_revision
      - submission_packaging
      - presentation
    available_capabilities:
      - research_orchestration
      - research_ideation
      - scholarly_search
      - literature_review
      - novelty_and_scope
      - study_design_statistics_and_data
      - figures_and_tables
      - writing_and_polishing
      - integrity_and_reproducibility
      - peer_review_and_response
      - research_delivery_and_presentation
      - external_skill_gateway
  undergraduate_thesis:
    purpose: Undergraduate thesis, graduation project, capstone, proposal, midterm, final thesis, or defense.
    stages:
      - requirement_discovery
      - topic_selection
      - proposal
      - design
      - implementation
      - testing_evaluation
      - data_analysis
      - thesis_writing
      - integrity_audit
      - midterm_check
      - final_packaging
      - defense_preparation
    available_capabilities:
      - research_orchestration
      - undergraduate_thesis
      - research_ideation
      - scholarly_search
      - literature_review
      - study_design_statistics_and_data
      - figures_and_tables
      - writing_and_polishing
      - integrity_and_reproducibility
      - research_delivery_and_presentation
      - external_skill_gateway
  hybrid_capstone_research:
    purpose: Graduation requirements first, with an optional research paper or portfolio upgrade.
    stages:
      - requirement_discovery
      - thesis_mvp
      - evidence_packaging
      - research_upgrade_decision
      - literature_review
      - novelty_verification
      - experiment_upgrade
      - data_analysis
      - paper_drafting
      - submission_or_defense_packaging
    available_capabilities:
      - research_orchestration
      - undergraduate_thesis
      - research_ideation
      - scholarly_search
      - literature_review
      - novelty_and_scope
      - study_design_statistics_and_data
      - figures_and_tables
      - writing_and_polishing
      - integrity_and_reproducibility
      - peer_review_and_response
      - research_delivery_and_presentation
      - external_skill_gateway

modes:
  literature_matrix:
    modules: [modules/06_literature_engine.md, modules/20_scholarly_search_screening_and_references.md]
    outputs: [templates/literature_matrix.csv, templates/search_protocol.md, templates/screening_log.csv]
  novelty_verification:
    modules: [modules/07_novelty_verification_and_scoring.md]
    outputs: [templates/novelty_verification.csv]
  experiment_matrix:
    modules: [modules/09_experiment_matrix_engine.md]
    outputs: [templates/experiment_matrix.csv]
  figure_design:
    modules: [modules/10_figure_table_engine.md]
    outputs: [templates/figure_brief.md]
  integrity_audit:
    modules: [modules/11_integrity_reproducibility_guard.md]
    outputs: [templates/integrity_checklist.md, templates/claim_ledger.csv]
  simulated_review_rebuttal:
    modules: [modules/13_simulated_review_rebuttal.md]
    outputs: [templates/simulated_review.md, templates/rebuttal_matrix.md]
  graduation_requirement_discovery:
    modules: [modules/04_requirement_discovery.md, modules/14_undergraduate_thesis_engine.md]
    outputs: [templates/requirement_discovery_log.md, templates/assumption_register.md, templates/scope_ladder.md, templates/graduation_evidence_map.csv]
  research_ideation:
    modules: [modules/18_research_ideation_and_question_design.md]
    outputs: [templates/research_idea_portfolio.csv]
  scholarly_search:
    modules: [modules/20_scholarly_search_screening_and_references.md]
    outputs: [templates/search_protocol.md, templates/screening_log.csv]
  statistical_analysis:
    modules: [modules/19_study_design_statistics_and_data.md]
    outputs: [templates/statistical_analysis_plan.md, templates/data_provenance.csv]
  paper_to_presentation:
    modules: [modules/21_research_delivery_and_presentation.md]
    outputs: [templates/paper_reading_note.md, templates/presentation_brief.md]
  submission_packaging:
    modules: [modules/21_research_delivery_and_presentation.md, modules/11_integrity_reproducibility_guard.md]
    outputs: [templates/submission_package_checklist.md, templates/data_provenance.csv]

stage_gates:
  script: scripts/check_stage_gate.py
  gates: [ideation, literature, analysis, drafting, submission, presentation, proposal, midterm, final, defense]

demo_scripts:
  - scripts/demo_academic_workflow.py
  - scripts/pre_prose_check.py
  - scripts/summarize_evidence_status.py
  - scripts/validate_demo_workspace.py
  - scripts/validate_evidence_status.py
  - scripts/check_claims_before_prose.py
  - scripts/check_stage_gate.py
  - scripts/resolve_capability.py
  - scripts/validate_capability_registry.py
  - schemas/evidence_status.schema.yaml
  - examples/outputs/sample-source-note.md
  - examples/generated-demo-workspace/DEMO_MANIFEST.json
  - examples/outputs/evidence-status-summary.generated.md
  - examples/outputs/pre-prose-check.generated.md
  - examples/outputs/claim-blocker-report.generated.md

external_skill_policy:
  strategy: provider_interface_then_validate_then_fallback
  preferred_gateway_module: modules/03_external_skill_gateway.md
  provider_router_module: modules/22_capability_provider_router.md
  acceptance_tests_module: modules/17_external_skill_acceptance_tests.md
  low_coupling_rules:
    - external_skill_must_not_mutate_core_modules_without_explicit_self_update
    - external_skill_outputs_go_to_project_workspace
    - core_invariants_override_external_skill_rules
    - rejected_candidates_must_be_recorded
    - fallback_to_internal_workflow_if_no_candidate_passes

backward_compatibility:
  protected_project_types: [research_paper, undergraduate_thesis, hybrid_capstone_research]
  protected_modes:
    - literature_matrix
    - novelty_verification
    - experiment_matrix
    - figure_design
    - integrity_audit
    - simulated_review_rebuttal
    - graduation_requirement_discovery
  protected_scripts:
    - scripts/pre_prose_check.py
    - scripts/summarize_evidence_status.py
    - scripts/validate_evidence_status.py
    - scripts/check_claims_before_prose.py
    - scripts/init_project.py
    - scripts/external_skill_gate.py
  protected_modules:
    - modules/03_external_skill_gateway.md
    - modules/04_requirement_discovery.md
    - modules/05_venue_intelligence.md
    - modules/06_literature_engine.md
    - modules/07_novelty_verification_and_scoring.md
    - modules/08_research_roi_scope.md
    - modules/09_experiment_matrix_engine.md
    - modules/10_figure_table_engine.md
    - modules/11_integrity_reproducibility_guard.md
    - modules/12_writing_style_adapter.md
    - modules/13_simulated_review_rebuttal.md
    - modules/14_undergraduate_thesis_engine.md

self_update:
  module: modules/15_self_update_maintenance.md
  allowed_changes:
    - simplify_wording
    - split_or_merge_modules
    - replace_underperforming_provider_mappings
    - update_tool_and_venue_recommendations
    - add_templates_schemas_and_acceptance_tests
    - improve_observed_behavior
  protected:
    - core_invariants
    - original_capability_coverage
    - evidence_first_policy
    - no_fabrication_policy
    - canonical_format_policy
    - external_skill_low_coupling_policy
    - provider_interface_contract
    - human_review_policy
